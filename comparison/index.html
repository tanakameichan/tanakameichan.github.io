<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",Meiryo,sans-serif;color:#20242a;background:#f4f6f8}
*{box-sizing:border-box}
body{margin:0;padding:22px;min-width:900px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 auto 18px;max-width:1600px}
h1{font-size:22px;margin:0 0 5px}
.sub{color:#65717d;font-size:13px}
.actions{display:flex;gap:8px;align-items:center}
button{border:1px solid #cbd2d9;background:#fff;border-radius:7px;padding:9px 14px;font-size:13px;cursor:pointer}
button.primary{background:#245da8;color:white;border-color:#245da8;font-weight:600}
button:hover{filter:brightness(.97)}
button:disabled{opacity:.45;cursor:not-allowed}
main{max-width:1600px;margin:auto}
.input-grid,.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.panel{background:white;border:1px solid #dce1e6;border-radius:10px;overflow:hidden}
.panel-head{padding:11px 14px;border-bottom:1px solid #e6e9ed;display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:650}
.panel-head small{font-weight:400;color:#77818b}
textarea{display:block;width:100%;height:230px;border:0;resize:vertical;padding:14px;font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,"Hiragino Kaku Gothic ProN",Meiryo,monospace;outline:none;white-space:pre;overflow:auto}
.toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 14px;margin:12px 0;background:#fff;border:1px solid #dce1e6;border-radius:9px;font-size:13px}
.toolbar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toolbar input{accent-color:#245da8}
#status{margin-left:auto;color:#68737e}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:#59636d;margin:14px 2px 8px}
.swatch{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px}
.del{background:#ffe1e1;color:#a51f28;text-decoration:line-through;text-decoration-thickness:1px}
.ins{background:#dcecff;color:#124f9c}
.note{background:#fff1c9;color:#704b00}
.result-grid{align-items:stretch}
.result-panel{min-width:0}
.result-head{position:sticky;top:0;z-index:2;background:#fafbfc}
.result-scroll{height:min(62vh,720px);min-height:320px;overflow-y:auto;overflow-x:hidden;background:#fff;scrollbar-gutter:stable}
.code-lines{font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,"Hiragino Kaku Gothic ProN",Meiryo,monospace;width:100%;min-width:0}
.line{display:flex;min-height:21.45px;border-bottom:1px solid #f0f2f4;white-space:pre}
.line:hover{background:#f8fafc}
.lno{flex:0 0 48px;text-align:right;padding:1px 9px 1px 4px;color:#9aa3ad;background:#f7f8fa;border-right:1px solid #edf0f2;user-select:none}
.content{padding:1px 10px;flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word}
.blank{background:#fafafa}
.empty{padding:35px;text-align:center;color:#89939d;font-size:13px}
#summary{font-size:13px;color:#56616c;margin:10px 2px 14px}
#summary strong{color:#20242a}
footer{max-width:1600px;margin:15px auto 0;color:#7b858f;font-size:11px}
@media(max-width:1050px){body{padding:12px}.content{min-width:420px}}

<body>
<header id="header"></header>    <!-- ヘッダーリンク -->
<header>
 <div><h1>テキスト比較ツール</h1><div class="sub">修正前・修正後の文章を文字単位で比較します。入力内容はこのブラウザ内で処理されます。</div></div>
 <div class="actions"><button id="clearBtn">入力をクリア</button><button class="primary" id="compareBtn">文章を比較する</button></div>
</header>
<main>
 <section class="input-grid">
  <div class="panel"><div class="panel-head">修正前 <small id="countA">0文字</small></div><textarea id="textA" spellcheck="false" placeholder="修正前の原稿を貼り付けてください"></textarea></div>
  <div class="panel"><div class="panel-head">修正後 <small id="countB">0文字</small></div><textarea id="textB" spellcheck="false" placeholder="修正後の原稿を貼り付けてください"></textarea></div>
 </section>
 <div class="toolbar">
  <label><input type="checkbox" id="showWhitespace" checked> 空白・タブを可視化</label>
  <label><input type="checkbox" id="showNewline" checked> 改行記号を表示</label>
  <label><input type="checkbox" id="ignoreFinalNewline"> 最後の改行を無視</label>
  <button id="copyBtn" disabled>比較結果をテキストコピー</button>
  <span id="status">文章を入力して「文章を比較する」を押してください</span>
 </div>
 <div class="legend">
  <span><i class="swatch" style="background:#ffe1e1"></i>削除（修正前）</span>
  <span><i class="swatch" style="background:#dcecff"></i>追加（修正後）</span>
  <span><i class="swatch" style="background:#fff1c9"></i>全角・半角などの表記差</span>
  <span>左右のスクロールは連動します</span>
 </div>
 <div id="summary"></div>
 <section class="result-grid">
  <div class="panel result-panel"><div class="panel-head result-head">修正前 <small id="labelA">比較結果</small></div><div class="result-scroll" id="scrollA"><div class="code-lines" id="outA"><div class="empty">比較結果がここに表示されます</div></div></div></div>
  <div class="panel result-panel"><div class="panel-head result-head">修正後 <small id="labelB">比較結果</small></div><div class="result-scroll" id="scrollB"><div class="code-lines" id="outB"><div class="empty">比較結果がここに表示されます</div></div></div></div>
 </section>
</main>
<footer>※長い原稿では比較に時間がかかる場合があります。空白・改行の表示は画面上の目印であり、コピー時は元の文字に戻します。</footer>
<script>
const $=id=>document.getElementById(id);
const a=$('textA'), b=$('textB');
let copyText='';
function updateCounts(){$('countA').textContent=a.value.length.toLocaleString()+'文字';$('countB').textContent=b.value.length.toLocaleString()+'文字'}
a.addEventListener('input',updateCounts);b.addEventListener('input',updateCounts);
$('clearBtn').onclick=()=>{a.value='';b.value='';updateCounts();$('outA').innerHTML='<div class="empty">比較結果がここに表示されます</div>';$('outB').innerHTML='<div class="empty">比較結果がここに表示されます</div>';$('summary').textContent='';$('status').textContent='文章を入力して「文章を比較する」を押してください';$('copyBtn').disabled=true};
function myers(a,b){
 const n=a.length,m=b.length,max=n+m, v=new Map([[1,0]]), trace=[];
 for(let d=0;d<=max;d++){
  trace.push(new Map(v));
  for(let k=-d;k<=d;k+=2){
   let x;
   if(k===-d||(k!==d&&(v.get(k-1)??-1)<(v.get(k+1)??-1))) x=v.get(k+1)??0;
   else x=(v.get(k-1)??0)+1;
   let y=x-k;
   while(x<n&&y<m&&a[x]===b[y]){x++;y++}
   v.set(k,x);
   if(x>=n&&y>=m){
    let ops=[],cx=n,cy=m;
    for(let dd=d;dd>=0;dd--){
     const vv=trace[dd], kk=cx-cy;
     let pk;
     if(kk===-dd||(kk!==dd&&(vv.get(kk-1)??-1)<(vv.get(kk+1)??-1)))pk=kk+1;else pk=kk-1;
     const px=vv.get(pk)??0, py=px-pk;
     while(cx>px&&cy>py){ops.push({t:'eq',v:a[cx-1]});cx--;cy--}
     if(dd===0)break;
     if(cx===px){ops.push({t:'ins',v:b[cy-1]});cy--}
     else{ops.push({t:'del',v:a[cx-1]});cx--}
    }
    return ops.reverse();
   }
  }
 }
 return [];
}
function splitLines(s){return s.split('\n')}
function lineOps(x,y){return myers(x,y)}
function charOps(x,y){return myers(Array.from(x),Array.from(y))}
function isWidthVariant(x,y){
 if(x===y)return false;
 const norm=s=>s.normalize('NFKC');
 return norm(x)===norm(y);
}
function pairChangedLines(ops){
 let out=[];
 for(let i=0;i<ops.length;){
  if(ops[i].t==='eq'){out.push({a:ops[i].v,b:ops[i].v,kind:'eq'});i++;continue}
  let ds=[],ins=[];
  while(i<ops.length&&ops[i].t!=='eq'){if(ops[i].t==='del')ds.push(ops[i].v);else ins.push(ops[i].v);i++}
  const pairs=Math.min(ds.length,ins.length);
  for(let j=0;j<pairs;j++)out.push({a:ds[j],b:ins[j],kind:'change'});
  for(let j=pairs;j<ds.length;j++)out.push({a:ds[j],b:null,kind:'del'});
  for(let j=pairs;j<ins.length;j++)out.push({a:null,b:ins[j],kind:'ins'});
 }
 return out;
}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function visible(s){
 if(!$('showWhitespace').checked&&!$('showNewline').checked)return esc(s);
 let out='';
 for(const c of s){
  if(c===' '&&$('showWhitespace').checked)out+='<span class="note">·</span>';
  else if(c==='\t'&&$('showWhitespace').checked)out+='<span class="note">⇥</span>';
  else if(c==='\r'&&$('showNewline').checked)out+='<span class="note">␍</span>';
  else out+=esc(c);
 }
 return out||'&nbsp;';
}
function renderLine(text,number,segments,side,blank=false){
 let body='';
 if(blank)body='&nbsp;';
 else if(!segments)body=visible(text);
 else{
  for(const seg of segments){
   const cls=seg.t==='del'?'del':seg.t==='ins'?'ins':seg.t==='note'?'note':'';
   if(!seg.v)continue;
   let val=visible(seg.v);
   body+=cls?`<span class="${cls}">${val}</span>`:val;
  }
  if(!body)body='&nbsp;';
 }
 return `<div class="line"><span class="lno">${number}</span><span class="content ${blank?'blank':''}">${body}</span></div>`;
}
function charSegments(oldLine,newLine,side){
 const ops=charOps(oldLine,newLine),out=[];let changes=0;
 for(let i=0;i<ops.length;){
  if(ops[i].t==='eq'){out.push({t:'eq',v:ops[i].v});i++;continue}
  let dels='',ins='';
  while(i<ops.length&&ops[i].t!=='eq'){if(ops[i].t==='del')dels+=ops[i].v;else ins+=ops[i].v;i++}
  if(dels&&ins&&Array.from(dels).length===Array.from(ins).length&&isWidthVariant(dels,ins)){
   out.push({t:'note',v:side==='a'?dels:ins});changes++;
  }else{
   if(side==='a'&&dels){out.push({t:'del',v:dels});changes++}
   if(side==='b'&&ins){out.push({t:'ins',v:ins});changes++}
  }
 }
 return {segments:out,changes};
}
function lineHTML(lines,side){
 let html='',lineNo=0,changeCount=0;
 for(const row of lines){
  lineNo++;
  if(row.kind==='eq'){html+=renderLine(row[side],lineNo,null,side);continue}
  if(row.kind==='del'&&side==='b'||row.kind==='ins'&&side==='a'){html+=renderLine('',lineNo,null,side,true);continue}
  if(row.a===null||row.b===null){const val=row[side]??'';html+=renderLine(val,lineNo,[{t:side==='a'?'del':'ins',v:val}],side);changeCount++;continue}
  const r=charSegments(row.a,row.b,side);html+=renderLine(row[side],lineNo,r.segments,side);changeCount+=r.changes;
 }
 return {html,changeCount};
}
function compare(){
 const oldText=$('ignoreFinalNewline').checked?a.value.replace(/\n$/,''):a.value;
 const newText=$('ignoreFinalNewline').checked?b.value.replace(/\n$/,''):b.value;
 if(oldText.length+newText.length>180000){$('status').textContent='文字数が多いため、18万文字以内に分けて比較してください';return}
 const oldLines=splitLines(oldText),newLines=splitLines(newText);
 const rows=pairChangedLines(lineOps(oldLines,newLines));
 const ra=lineHTML(rows,'a'),rb=lineHTML(rows,'b');
 $('outA').innerHTML=ra.html||'<div class="empty">（空の文章）</div>';
 $('outB').innerHTML=rb.html||'<div class="empty">（空の文章）</div>';
 const edits=rows.filter(r=>r.kind!=='eq').length;
 $('summary').innerHTML=`比較行数：<strong>${rows.length.toLocaleString()}</strong>　／　変更行：<strong>${edits.toLocaleString()}</strong>　／　変更表示：<strong>${Math.max(ra.changeCount,rb.changeCount).toLocaleString()}</strong>`;
 $('status').textContent='比較完了';
 $('copyBtn').disabled=false;
 copyText=`【修正前】\n${a.value}\n\n【修正後】\n${b.value}`;
 $('scrollA').scrollTop=0;$('scrollB').scrollTop=0;
}
$('compareBtn').onclick=compare;
$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText(copyText);$('status').textContent='原稿テキストをコピーしました'}catch(e){$('status').textContent='コピーできませんでした。ブラウザの権限を確認してください'}};
let syncing=false;
function sync(from,to){if(syncing)return;syncing=true;to.scrollTop=from.scrollTop;requestAnimationFrame(()=>syncing=false)}
$('scrollA').addEventListener('scroll',()=>sync($('scrollA'),$('scrollB')));
$('scrollB').addEventListener('scroll',()=>sync($('scrollB'),$('scrollA')));
updateCounts();
</script>
<footer id="footer"></footer>    <!-- フッターリンク -->
</body>
</html>
